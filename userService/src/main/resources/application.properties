spring.application.name=userService
server.port=${SERVER_PORT:8081}

auth-service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8080}
auth-service.connect-timeout-ms=2000
auth-service.read-timeout-ms=3000

# Required: no default, must be set via env var
internal-api.key=${INTERNAL_API_KEY}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userservice}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
