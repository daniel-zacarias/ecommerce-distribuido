spring.application.name=authService

user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}
user-service.connect-timeout-ms=2000
user-service.read-timeout-ms=3000

jwt.secret=${JWT_SECRET:change-me-in-prod-please-use-env-var-with-at-least-32-bytes}
jwt.access-token-expiration-minutes=30
jwt.refresh-token-expiration-minutes=10080

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
